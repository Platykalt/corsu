name: Traduction · Translation
description: Une traduction corse fausse, manquante ou maladroite · A wrong, missing or clumsy Corsican translation
labels: [translation]
# The window's « Signaler » page (src/app/report.js) prefills these fields by their id: keep the ids.
body:
  - type: markdown
    attributes:
      value: |
        N'y mettez ni conversation, ni pseudonyme, ni nom de personne, ni chemin de vos dossiers.
        Do not put conversations, nicknames, people's names or your folder paths in it.
  - type: input
    id: app
    attributes:
      label: Logiciel · Program
      description: Par exemple Discord, Firefox, Minecraft · For example Discord, Firefox, Minecraft.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version du logiciel · Program version
      description: Si vous la connaissez · If you know it.
  - type: input
    id: seen
    attributes:
      label: Texte vu · Text you saw
      description: Copiez-le tel quel, en français, anglais ou corse · Copy it exactly, in French, English or Corsican.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Où · Where
      description: L'endroit dans le logiciel, par exemple « menu du clic droit » · The place in the program, e.g. "right-click menu".
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Clé (si vous la connaissez) · Key (if you know it)
      description: Pour Minecraft, la clé de co_fr.json, par exemple « options.language » · For Minecraft, the co_fr.json key, e.g. "options.language".
  - type: input
    id: proposal
    attributes:
      label: Corse proposé · Corsican you suggest
  - type: textarea
    id: notes
    attributes:
      label: Remarques · Notes
  - type: input
    id: corsu
    attributes:
      label: Version de Corsu · Corsu version
      description: Remplie par la fenêtre de Corsu · Filled in by Corsu's window.
