name: CI

# Every push is checked on Linux, Windows and macOS. A `v*` tag publishes a GitHub release,
# but only when every guard below passes against the exact archives being released.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  package:
    name: Build Vencord and package releases
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check out the pinned Vencord revision
        run: |
          revision=$(python -c "import json; print(json.load(open('src/release.json'))['vencord_revision'])")
          git init -q Vencord
          # Vencord's build reads the `origin` remote for its user agent.
          git -C Vencord remote add origin https://github.com/Vendicated/Vencord.git
          git -C Vencord fetch -q --depth 1 origin "$revision"
          git -C Vencord checkout -q FETCH_HEAD
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Vencord/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the Corsu plugin into Vencord
        run: PYTHONPATH=src python -c "import installer; installer.prepare_build()"
      - name: Discord plugin in a real browser page — people's names are never translated
        run: python tests/e2e/check_discord_names.py "$(command -v google-chrome || command -v chromium)" Vencord
      - name: Bundle the French Firefox language pack (offline fallback)
        run: |
          version=$(curl -fsSL https://product-details.mozilla.org/1.0/firefox_versions.json | python -c "import json,sys; print(json.load(sys.stdin)['LATEST_FIREFOX_VERSION'])")
          curl -fsSL "https://archive.mozilla.org/pub/firefox/releases/$version/SHA512SUMS" | grep ' linux-x86_64/xpi/fr.xpi$' | awk '{print $1"  vendor/firefox-fr.xpi"}' > fr.sha512
          curl -fsSL -o vendor/firefox-fr.xpi "https://archive.mozilla.org/pub/firefox/releases/$version/linux-x86_64/xpi/fr.xpi"
          sha512sum -c fr.sha512
      - name: Package Linux, Windows and macOS archives
        run: python tools/package_release.py --output dist
      - name: Build the Corsican keyboard prediction package (Keyman)
        run: |
          python tools/build_keyboard.py --package
          cp keyboard/build/corsu-keyboard.kmp dist/corsu-keyboard.kmp
          (cd dist && sha256sum corsu-keyboard.kmp > corsu-keyboard.kmp.sha256)
      - name: Minecraft Java — check every key and placeholder against Mojang's English, build the resource pack
        run: |
          python tools/minecraft.py check
          python tools/minecraft.py build
          python tools/minecraft.py texts
          git diff --exit-code minecraft/java/pack.mcmeta
          version=$(cat minecraft/java/VERSION)
          (cd dist && sha256sum "corsu-minecraft-java-$version.zip" "corsu-minecraft-java-texts-$version.zip" > "corsu-minecraft-java-$version.zip.sha256")
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Minecraft Java — load and render every text with the game's own code
        run: python tools/minecraft.py verify
      - uses: actions/cache@v4
        with:
          path: ~/.cache/corsu/minecraft
          key: minecraft-${{ hashFiles('minecraft/java/versions.json') }}
          restore-keys: minecraft-
      - name: Minecraft Java, every release from 1.6.1 — packs built and checked; the first targets in their own game code
        run: |
          python tools/mcversions.py fetch all
          python tools/mcversions.py verify all --no-engine
          # Pages and recorded checks against the committed data, before verify rewrites today's dates.
          python tools/mcreport.py --check
          python tools/mcversions.py verify targets
      - uses: actions/upload-artifact@v4
        with:
          name: releases
          path: dist/
          if-no-files-found: error

  e2e:
    name: End-to-end (${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: corsu-linux.tar.gz
          - os: windows-latest
            archive: corsu-windows.zip
          - os: macos-latest
            archive: corsu-macos.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      # Screenshots and page excerpts the browser checks save when they fail.
      CORSU_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: releases
          path: dist
      - name: Extract the release archive for this platform
        shell: bash
        run: |
          cd dist
          archive=${{ matrix.archive }}
          sha256sum -c "$archive.sha256" 2>/dev/null || shasum -a 256 -c "$archive.sha256"
          mkdir extracted
          case "$archive" in *.zip) unzip -q "$archive" -d extracted ;; *) tar xzf "$archive" -C extracted ;; esac
          echo "CORSU_RELEASE=dist/extracted/corsu" >> "$GITHUB_ENV"
          # The archive's own Python, as on a computer without Python.
          case "$RUNNER_OS-$(uname -m)" in
            Windows-*) python=runtime/x86_64/python/python.exe ;;
            macOS-arm64) python=runtime/aarch64/python/bin/python3 ;;
            *) python=runtime/x86_64/python/bin/python3 ;;
          esac
          test -x "extracted/corsu/$python" || test -f "extracted/corsu/$python"
          echo "CORSU_PYTHON=$GITHUB_WORKSPACE/dist/extracted/corsu/$python" >> "$GITHUB_ENV"
      - name: Install Firefox (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o firefox.tar.xz "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
          mkdir -p "$RUNNER_TEMP/mozilla" && tar xf firefox.tar.xz -C "$RUNNER_TEMP/mozilla"
          echo "CORSU_FIREFOX=$RUNNER_TEMP/mozilla/firefox" >> "$GITHUB_ENV"
      - name: Install Firefox (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Test-Path "$env:ProgramFiles\Mozilla Firefox\firefox.exe")) { choco install firefox -y --no-progress }
      - name: Install Firefox (macOS)
        if: runner.os == 'macOS'
        run: test -d /Applications/Firefox.app || brew install --cask firefox
      - name: Firefox — install, launch the translated build, disable, enable, uninstall
        run: python tests/e2e/e2e.py firefox --root "${{ env.CORSU_RELEASE }}"
      - name: Archive route — install from the extracted archive, delete it, use, update from these archives, remove
        shell: bash
        run: |
          echo "Source commit: $GITHUB_SHA"
          (cd dist && (sha256sum corsu-*.tar.gz corsu-*.zip 2>/dev/null || shasum -a 256 corsu-*.tar.gz corsu-*.zip))
          CORSU_ARCHIVES="$GITHUB_WORKSPACE/dist" python tests/e2e/e2e.py archive --root "${{ env.CORSU_RELEASE }}"
      - name: Update — from published 0.21.0 and 0.22.0 to these archives, repair, refusal, recovery, lock, uninstall
        shell: bash
        run: python tests/e2e/check_update.py --archives "$GITHUB_WORKSPACE/dist" --from 0.21.0 0.22.0 0.23.0
      - name: One-line install script with these archives (CORSU_DOWNLOAD_BASE), checksum checked
        shell: bash
        run: |
          export CORSU_DOWNLOAD_BASE=$(python -c "import pathlib; print(pathlib.Path('dist').resolve().as_uri())")
          export HOME="$RUNNER_TEMP/get-home" && mkdir -p "$HOME"
          if [ "$RUNNER_OS" = Windows ]; then
            export USERPROFILE="$HOME" APPDATA="$HOME/AppData/Roaming" LOCALAPPDATA="$HOME/AppData/Local"
            pwsh -NoProfile -File install/get.ps1 --dry-run --components firefox | tee out.txt
          else
            sh install/get.sh --dry-run --components firefox | tee out.txt
          fi
          grep -q Firefox out.txt
      - name: Discord — patch with the official Vencord installer, then restore (with the archive's own Python)
        shell: bash
        run: '"$CORSU_PYTHON" tests/e2e/e2e.py discord --root "${{ env.CORSU_RELEASE }}"'
      - name: VLC (Linux) — real VLC package, Corsu switches it to Corsican, VLC shows Corsican, switch back
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq vlc vlc-l10n locales
          # gettext ignores LANGUAGE under the C locale: a desktop session has a real one, the runner needs it made.
          sudo locale-gen fr_FR.UTF-8
          ls /usr/share/applications/vlc.desktop
          ls -l /usr/share/locale/co/LC_MESSAGES/vlc.mo
          python tests/e2e/check_vlc.py
      - name: VLC (Linux) — every Corsican draft checked; the experimental complement shown by real VLC, through Corsu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq gettext
          python tools/vlcpo.py check
          python tools/vlcpo.py build "$RUNNER_TEMP/vlc-experimental.mo"
          python tools/vlcpo.py build "$RUNNER_TEMP/vlc-upstream.mo" --include=none
          python tests/e2e/check_vlc_experimental.py --mo "$RUNNER_TEMP/vlc-experimental.mo" --upstream "$RUNNER_TEMP/vlc-upstream.mo"
          HOME="$(mktemp -d)" XDG_DATA_HOME= XDG_CONFIG_HOME= python tests/e2e/check_vlc_complement.py
      - name: Update from 0.23.0 with VLC and its complement (Linux, real VLC package)
        if: runner.os == 'Linux'
        # Ubuntu has no fre:ac package: its part of this check runs where fre:ac is installed (Debian).
        run: python tests/e2e/check_update_apps.py --archives "$GITHUB_WORKSPACE/dist" --from 0.23.0
      - name: VLC complement declared unavailable (Windows, macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from apps import vlc_complement; s = vlc_complement.status(); print(s); assert s['available'] is False and 'Linux' in s['reason'], s"
      - name: Windows programs — 7-Zip, VLC and Notepad++ set to Corsican in the real registry and back
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          choco install vlc notepadplusplus -y --no-progress
          python tests/e2e/check_windows_apps.py
      - name: Chromium — translate Chrome for Testing, read it in Corsican, switch off/on, restore
        if: runner.os != 'macOS'
        shell: bash
        run: |
          platform=$([ "$RUNNER_OS" = Windows ] && echo win64 || echo linux64)
          url=$(curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            | python -c "import json,sys; d=json.load(sys.stdin)['channels']['Stable']['downloads']['chrome']; print([x['url'] for x in d if x['platform']=='$platform'][0])")
          curl -fsSL -o cft.zip "$url" && unzip -q cft.zip -d "$RUNNER_TEMP/cft"
          export CORSU_CHROMIUM="$RUNNER_TEMP/cft/chrome-$platform"
          python tests/e2e/e2e.py chromium --root "${{ env.CORSU_RELEASE }}"
      - name: Keep what the failed checks saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ matrix.os }}
          path: e2e-artifacts
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: releases
          path: dist
      - name: Check the tag matches src/release.json
        run: test "v$(python3 -c "import json; print(json.load(open('src/release.json'))['version'])")" = "$GITHUB_REF_NAME"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/corsu-* --title "Corsu $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md

  smoke:
    name: One-line install of the published release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: get.sh downloads, checks and starts the installer
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o firefox.tar.xz "https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US"
          mkdir -p "$RUNNER_TEMP/mozilla" && tar xf firefox.tar.xz -C "$RUNNER_TEMP/mozilla"
          export CORSU_FIREFOX="$RUNNER_TEMP/mozilla/firefox"
          sh install/get.sh --dry-run --components firefox | tee out.txt
          grep -q "make a translated copy of Firefox" out.txt
      - name: get.ps1 downloads, checks and starts the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles\Mozilla Firefox\firefox.exe")) { choco install firefox -y --no-progress }
          ./install/get.ps1 --dry-run --components firefox | Tee-Object out.txt
          if (-not (Select-String -Path out.txt -Pattern 'make a translated copy of Firefox' -Quiet)) { exit 1 }
