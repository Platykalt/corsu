# Written by Corsu only when ~/.config/qt6ct/qt6ct.conf does not exist. qt6ct is read only where
# QT_QPA_PLATFORMTHEME=qt6ct, i.e. in the Hyprland session; Plasma keeps its own Qt theme.
# @CONFIG_HOME@ is replaced by the absolute XDG config folder at write time (qt6ct does not expand variables).
[Appearance]
color_scheme_path=@CONFIG_HOME@/qt6ct/colors/noctalia.conf
custom_palette=true
icon_theme=breeze
standard_dialogs=default
style=Breeze
