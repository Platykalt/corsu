<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corsu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f2a2e'/%3E%3Ctext x='16' y='22.5' font-family='Georgia,serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3Eco%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --window: #fbfbfa; --sidebar: #f1f1ef; --text: #1d1f20; --muted: #63686b; --line: #dcdedd; --row: #ffffff;
  --hover: #ececea; --selected: #e1e5e7; --accent: #2d5f7c; --on-accent: #ffffff; --danger: #a1302b;
  --track: #b9bebf; --focus: #3d84b8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --window: #1e2021; --sidebar: #191b1c; --text: #e4e6e6; --muted: #9a9fa1; --line: #33373a; --row: #25282a;
    --hover: #2b2f31; --selected: #30373b; --accent: #7fb2cf; --on-accent: #10202a; --danger: #ee8d86;
    --track: #4a5053; --focus: #8cc0e0;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--window); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans", Cantarell, sans-serif; }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
button { font: inherit; color: inherit; }

.app { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 100vh; }
aside { background: var(--sidebar); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 6px; }
.brand img { width: 26px; height: 26px; }
.brand b { font-size: 15px; }
.brand small { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
nav { display: flex; flex-direction: column; gap: 1px; }
nav button { text-align: left; border: 0; background: none; padding: 6px 9px; border-radius: 5px; cursor: pointer; }
nav button:hover { background: var(--hover); }
nav button[aria-current="page"] { background: var(--selected); font-weight: 600; }
.language { margin-top: auto; padding: 0 8px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.language select { font: inherit; color: var(--text); background: var(--row); border: 1px solid var(--line); border-radius: 4px; padding: 3px 4px; }

main { padding: 26px 34px 90px; max-width: 760px; }
h1 { font-size: 21px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
.lead { color: var(--muted); margin: 0 0 20px; }
h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 26px 0 7px 2px; }
p { margin: 0 0 10px; }

.group { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--row); }
.group > li { display: flex; align-items: center; gap: 14px; padding: 10px 14px; min-height: 52px; }
.group > li + li { border-top: 1px solid var(--line); }
.group .label { flex: 1; min-width: 0; }
.group .label > :first-child { display: block; font-weight: 500; }
.group .detail { display: block; color: var(--muted); font-size: 13px; }
.group .hint { display: block; color: var(--accent); font-size: 13px; margin-top: 2px; }
.group .state { color: var(--muted); font-size: 13px; white-space: nowrap; }
.group a.label { color: inherit; text-decoration: none; }
.group a.label:hover > :first-child { text-decoration: underline; text-underline-offset: 2px; }
.group li.link:hover { background: var(--hover); }
.external { color: var(--muted); font-size: 12px; }

.switch { position: relative; flex: none; width: 36px; height: 20px; }
.switch input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 10px; background: var(--track); pointer-events: none; transition: background-color .12s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .12s ease-out; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(16px); }
.switch input:focus-visible + i { outline: 2px solid var(--focus); outline-offset: 2px; }
.switch input:disabled { cursor: default; }
.switch input:disabled + i { opacity: .55; }
input[type="checkbox"].pick { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); flex: none; }

.button { border: 1px solid var(--line); background: var(--row); padding: 5px 12px; border-radius: 4px; cursor: pointer; }
.button:hover { background: var(--hover); }
.button.default { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.button.default:hover { filter: brightness(1.07); }
.button.destructive { color: var(--danger); }
.button:disabled { opacity: .5; cursor: default; filter: none; }
.textbutton { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.textbutton:disabled { color: var(--muted); cursor: default; text-decoration: none; }
.buttons { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.buttons.end { justify-content: flex-end; }
.muted { color: var(--muted); }
.empty { color: var(--muted); padding: 4px 2px; }

.activity { position: fixed; left: 210px; right: 0; bottom: 0; background: var(--sidebar); border-top: 1px solid var(--line); padding: 9px 34px; }
.activity[hidden] { display: none; }
.activity .line { display: flex; align-items: center; gap: 10px; }
.activity .line span { flex: 1; }
.activity.failed .line span { color: var(--danger); }
.activity pre { margin: 8px 0 2px; max-height: 38vh; overflow: auto; white-space: pre-wrap; word-break: break-word;
  font: 12px/1.5 ui-monospace, "Cascadia Mono", "DejaVu Sans Mono", Menlo, monospace; color: var(--muted); }
.busy { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--track); border-top-color: var(--accent); animation: turn .9s linear infinite; flex: none; }
@keyframes turn { to { transform: rotate(360deg); } }

dialog { border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px 16px; max-width: 560px; width: calc(100% - 32px); background: var(--window); color: var(--text); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog h3 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
dialog pre { margin: 0; max-height: 50vh; overflow: auto; white-space: pre-wrap; word-break: break-word; font: inherit; color: var(--text); }

dl.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 0; margin: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--row); }
dl.facts dt, dl.facts dd { margin: 0; padding: 9px 14px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { overflow-wrap: anywhere; }
dl.facts dt:not(:first-of-type), dl.facts dd:not(:first-of-type) { border-top: 1px solid var(--line); }
.closed { padding: 60px 34px; color: var(--muted); }
.banner { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin: 0 0 20px; border: 1px solid var(--line); border-radius: 6px; background: var(--row); }
.banner[hidden] { display: none; }
.banner span { flex: 1; }
.review dl { margin: 0; }
.review { border: 1px solid var(--line); border-radius: 6px; background: var(--row); padding: 16px; }
.review dt { color: var(--muted); font-size: 12px; margin-top: 10px; }
.review dt:first-child { margin-top: 0; }
.review dd { margin: 2px 0 0; }
.review dd.source { font-size: 16px; }
.review textarea { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--window); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; resize: vertical; min-height: 2.4em; }
.review .error { color: var(--danger); font-size: 13px; margin-top: 6px; }
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar select { font: inherit; color: var(--text); background: var(--row); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }

@media (prefers-reduced-motion: reduce) { .busy { animation: none; } .switch i, .switch i::after { transition: none; } }
@media (max-width: 640px) {
  .app { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; }
  nav { flex-direction: row; flex-wrap: wrap; }
  .language { margin: 0 0 0 auto; flex-direction: row; align-items: center; }
  .brand small { display: none; }
  main { padding: 20px 16px 110px; }
  .activity { left: 0; padding: 9px 16px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand"><img src="corsu.svg" alt=""><b>Corsu</b><small id="version"></small></div>
    <nav aria-label="Corsu">
      <button type="button" data-page="programs" data-t="nav_programs"></button>
      <button type="button" data-page="add" data-t="nav_add"></button>
      <button type="button" data-page="review" data-t="nav_review"></button>
      <button type="button" data-page="help" data-t="nav_help"></button>
      <button type="button" data-page="about" data-t="nav_about"></button>
    </nav>
    <label class="language"><span data-t="language"></span>
      <select id="language"><option value="fr">Français</option><option value="en">English</option></select>
    </label>
  </aside>

  <main>
    <div class="banner" id="update-banner" hidden aria-live="polite">
      <span id="update-text"></span>
      <button type="button" class="button default" id="update-install" data-t="update_install"></button>
    </div>
    <section id="programs" data-page-panel>
      <h1 data-t="nav_programs"></h1>
      <p class="lead" id="programs-lead"></p>
      <ul class="group" id="switches"></ul>
      <div id="terminal-block" hidden>
        <h2 data-t="terminal"></h2>
        <ul class="group">
          <li>
            <span class="label"><label for="switch-terminal" data-t="terminal_label"></label><span class="detail" id="terminal-detail"></span></span>
            <span class="switch"><input type="checkbox" role="switch" id="switch-terminal"><i></i></span>
          </li>
        </ul>
        <div class="buttons"><button type="button" class="button" id="pause-hour" data-t="pause_hour"></button></div>
      </div>
      <h2 data-t="learn"></h2>
      <ul class="group">
        <li>
          <span class="label"><label for="switch-original" data-t="show_original"></label><span class="detail" data-t="show_original_detail"></span></span>
          <span class="switch"><input type="checkbox" role="switch" id="switch-original"><i></i></span>
        </li>
      </ul>
      <h2 data-t="everything"></h2>
      <p class="muted" id="everything-text"></p>
      <div class="buttons"><button type="button" class="button" id="everything"></button></div>
    </section>

    <section id="add" data-page-panel hidden>
      <h1 data-t="nav_add"></h1>
      <p class="lead" id="add-lead"></p>
      <ul class="group" id="choices"></ul>
      <div class="buttons"><button type="button" class="button default" id="review" data-t="install_ellipsis"></button></div>
      <p class="muted" style="margin-top:18px" data-t="add_missing"></p>
    </section>

    <section id="review" data-page-panel hidden>
      <h1 data-t="nav_review"></h1>
      <p class="lead" data-t="review_lead"></p>
      <div class="toolbar">
        <select id="review-section" aria-label="Section"><option value="Discord">Discord</option><option value="Google">Google</option></select>
        <span class="muted" id="review-progress"></span>
      </div>
      <div class="review" id="review-card">
        <dl>
          <dt data-t="review_french"></dt><dd class="source" id="review-french"></dd>
          <dt data-t="review_english"></dt><dd class="muted" id="review-english"></dd>
          <dt><label for="review-corsican" data-t="review_corsican"></label></dt>
          <dd><textarea id="review-corsican" rows="2" spellcheck="false"></textarea><div class="error" id="review-error" hidden></div></dd>
        </dl>
        <div class="buttons">
          <button type="button" class="button default" id="review-ok" data-t="review_ok"></button>
          <button type="button" class="button" id="review-fix" data-t="review_fix"></button>
          <button type="button" class="button" id="review-skip" data-t="review_skip"></button>
        </div>
      </div>
      <p class="muted" id="review-done" hidden data-t="review_done"></p>
      <h2 data-t="review_share"></h2>
      <p class="muted" data-t="review_share_text"></p>
      <div class="buttons"><button type="button" class="button" id="review-send" data-t="review_send"></button></div>
    </section>

    <section id="help" data-page-panel hidden>
      <h1 data-t="nav_help"></h1>
      <p class="lead" data-t="help_lead"></p>
      <ul class="group" id="guides"></ul>
      <h2 data-t="practice"></h2>
      <p class="muted" data-t="practice_text"></p>
      <ul class="group" id="practice"></ul>
    </section>

    <section id="about" data-page-panel hidden>
      <h1 data-t="nav_about"></h1>
      <p class="lead" data-t="about_lead"></p>
      <dl class="facts" id="facts"></dl>
      <h2 data-t="remove_heading"></h2>
      <p class="muted" data-t="remove_text"></p>
      <div class="buttons"><button type="button" class="button destructive" id="remove" data-t="remove_ellipsis"></button></div>
    </section>
  </main>

  <div class="activity" id="activity" hidden aria-live="polite">
    <div class="line">
      <span class="busy" id="busy"></span><span id="activity-text"></span>
      <button type="button" class="textbutton" id="details-toggle"></button>
    </div>
    <pre id="log" hidden></pre>
  </div>
</div>

<dialog id="plan-dialog" aria-labelledby="plan-title">
  <h3 id="plan-title" data-t="plan_title"></h3>
  <pre id="plan"></pre>
  <div class="buttons end">
    <button type="button" class="button" data-close data-t="cancel"></button>
    <button type="button" class="button default" id="install" data-t="install"></button>
  </div>
</dialog>

<dialog id="remove-dialog" aria-labelledby="remove-title">
  <h3 id="remove-title" data-t="remove_question"></h3>
  <p data-t="remove_text"></p>
  <div class="buttons end">
    <button type="button" class="button" data-close data-t="cancel"></button>
    <button type="button" class="button destructive" id="remove-confirm" data-t="remove"></button>
  </div>
</dialog>

const systems = { windows: "Windows", macos: "macOS", linux: "Linux" };

let language = null;
try { language = localStorage.getItem("corsu-language"); } catch (error) {}
let chosen = Boolean(language);
let state = null, page = null, picks = null, closed = false, showLog = false;
const restartHints = new Map();

const $ = id => document.getElementById(id);
const t = (name, values = {}) => (text[language || "fr"][name] ?? name).replace(/\{(\w+)\}/g, (_, k) => values[k]);
function make(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes)) {
    if (name === "text") node.textContent = value;
    else if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
    else if (value === true) node.setAttribute(name, "");
    else if (value !== false && value != null) node.setAttribute(name, value);
  }
  node.append(...children.filter(child => child != null));
  return node;
}

async function call(path, body) {
  const response = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "X-Corsu-Key": key, "Content-Type": "application/json" },
    body: body ? JSON.stringify({ language, ...body }) : undefined,
  });
  if (response.status === 409) { alert(t("busy")); return null; }
  if (!response.ok) throw new Error(String(response.status));
  return response.json();
}

function show(name) {
  page = name;
  for (const button of document.querySelectorAll("[data-page]")) {
    if (button.dataset.page === name) button.setAttribute("aria-current", "page");
    else button.removeAttribute("aria-current");
  }
  for (const panel of document.querySelectorAll("[data-page-panel]")) panel.hidden = panel.id !== name;
}

function switchRow(item, busy) {
  const [name, detail] = item.text[language];
  const id = "switch-" + item.name;
  const hint = restartHints.get(item.name);
  return make("li", {},
    make("span", { class: "label" },
      make("label", { for: id, text: name }),
      make("span", { class: "detail", text: detail }),
      hint ? make("span", { class: "hint", text: hint }) : null),
    make("span", { class: "switch" },
      make("input", { type: "checkbox", role: "switch", id, checked: item.on, disabled: busy, onchange: event => {
        restartHints.set(item.name, item.name === "desktop" ? t("restart_desktop") : t("restart", { name }));
        call("/api/switch", { components: [item.name], on: event.target.checked }).then(refresh);
      } }),
      make("i")));
}

function renderPrograms() {
  const busy = state.job.running;
  const list = $("switches");
  const rows = [];
  for (const item of state.items) {
    if (item.name === "terminal") continue;
    if (item.switchable) rows.push(switchRow(item, busy));
    else if (item.installed) {
      const [name, detail] = item.text[language];
      rows.push(make("li", {}, make("span", { class: "label" }, make("span", { text: name }), make("span", { class: "detail", text: detail })),
        make("span", { class: "state", text: t("installed") })));
    }
  }
  if (!rows.length) {
    rows.push(make("li", {}, make("span", { class: "label muted", text: t("programs_none") }),
      make("button", { type: "button", class: "button", text: t("go_add"), onclick: () => show("add") })));
  }
  list.replaceChildren(...rows);
  $("programs-lead").textContent = t("programs_lead");

  const terminal = state.items.find(item => item.name === "terminal");
  $("terminal-block").hidden = !terminal;
  if (terminal) {
    const until = state.terminal_paused_until;
    $("switch-terminal").checked = until === null;
    $("switch-terminal").disabled = busy;
    $("terminal-detail").textContent = until === null ? t("terminal_on") : until === 0 ? t("terminal_off")
      : t("terminal_until", { time: new Date(until * 1000).toLocaleTimeString(language, { hour: "2-digit", minute: "2-digit" }) });
    $("pause-hour").hidden = until !== null;
    $("pause-hour").disabled = busy;
  }

  const off = state.everything_off;
  $("everything-text").textContent = t(off ? "everything_off_text" : "everything_on_text");
  $("everything").textContent = t(off ? "everything_on" : "everything_off");
  $("everything").disabled = busy || !state.installed;
}

function renderAdd() {
  const candidates = state.items.filter(item => !item.installed && item.name !== "terminal");
  if (picks === null) picks = new Set(candidates.map(item => item.name));
  $("add-lead").textContent = t("add_lead");
  const rows = candidates.map(item => {
    const [name, detail] = item.text[language];
    const id = "pick-" + item.name;
    return make("li", {},
      make("input", { type: "checkbox", class: "pick", id, checked: picks.has(item.name), onchange: event => {
        if (event.target.checked) picks.add(item.name); else picks.delete(item.name);
      } }),
      make("span", { class: "label" }, make("label", { for: id, text: name }), make("span", { class: "detail", text: detail })));
  });
  $("choices").replaceChildren(...(rows.length ? rows : [make("li", {}, make("span", { class: "label muted", text: t("add_none") }))]));
  $("review").hidden = !candidates.length;
  $("review").disabled = state.job.running;
}

function linkRow(href, title, detail) {
  return make("li", { class: "link" },
    make("a", { class: "label", href, target: "_blank", rel: "noopener noreferrer" },
      make("span", { text: title }), detail ? make("span", { class: "detail", text: detail }) : null),
    make("span", { class: "external", "aria-hidden": "true", text: "↗" }));
}

function renderHelp() {
  const fr = language === "fr";
  const computer = fr ? `fr/ordinateur/${state.platform}.md` : `en/computer/${state.platform}.md`;
  $("guides").replaceChildren(
    linkRow(docs + computer, t("guide_install", { system: systems[state.platform] || state.platform })),
    linkRow(docs + (fr ? "fr/discord.md" : "en/discord.md"), t("guide_discord")),
    linkRow(docs + (fr ? "fr/telephone/android.md" : "en/phone/android.md"), t("guide_phone")),
    linkRow(docs + (fr ? "fr/compatibilite.md" : "en/compatibility.md"), t("guide_compat")),
    linkRow(docs + (fr ? "fr/ce-que-corsu-modifie.md" : "en/what-corsu-changes.md"), t("guide_changes")),
    linkRow(docs + (fr ? "fr/pourquoi-corsu.md" : "en/why-corsu.md"), t("guide_why")),
    linkRow("https://github.com/Platykalt/corsu/issues/new?template=translation.yml", t("report")));
  $("practice").replaceChildren(
    linkRow("https://www.sapienzia.io", "Sapienzia", t("sapienzia")),
    linkRow("https://astutu.corsica", "Astutu", t("astutu")),
    linkRow("https://liv.corsica", "LIV", t("liv")));
}

function renderAbout() {
  const rows = [[t("version"), state.version], [t("system"), systems[state.platform] || state.platform],
    [t("lexicon"), t("lexicon_count", { n: state.lexicon_entries.toLocaleString(language) })]];
  if (state.firefox_profile) rows.push([t("profile"), state.firefox_profile]);
  const facts = rows.flatMap(([term, value]) => [make("dt", { text: term }), make("dd", { text: value })]);
  facts.push(make("dt", { text: t("source") }),
    make("dd", {}, make("a", { href: "https://github.com/Platykalt/corsu", target: "_blank", rel: "noopener noreferrer", text: "github.com/Platykalt/corsu" })));
  $("facts").replaceChildren(...facts);
  $("remove").disabled = !state.installed || state.job.running;
}

function renderActivity() {
  const job = state.job;
  const bar = $("activity");
  bar.hidden = !job.title;
  if (!job.title) return;
  const name = t("job_" + job.title);
  bar.classList.toggle("failed", job.ok === false);
  $("busy").hidden = !job.running;
  $("activity-text").textContent = t(job.running ? "running" : job.ok ? "done" : "failed", { job: name });
  if (job.ok === false) showLog = true;
  $("details-toggle").textContent = t(showLog ? "hide_details" : "show_details");
  const log = $("log");
  log.hidden = !showLog;
  const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
  log.textContent = job.lines.join("\n");
  if (atEnd) log.scrollTop = log.scrollHeight;
}

let reviewItem = null, reviewSection = "Discord";

async function loadReview() {
  const result = await call(`/api/review/next?section=${reviewSection}`);
  if (!result) return;
  reviewItem = result.item;
  const progress = result.progress[reviewSection];
  $("review-progress").textContent = t("review_progress", { done: progress.done.toLocaleString(language), total: progress.total.toLocaleString(language), fixed: t((language === "fr" ? progress.fixed <= 1 : progress.fixed === 1) ? "corrections_one" : "corrections_many", { n: progress.fixed }) });
  $("review-card").hidden = !reviewItem;
  $("review-done").hidden = Boolean(reviewItem);
  $("review-error").hidden = true;
  if (!reviewItem) return;
  $("review-french").textContent = reviewItem.french || "—";
  $("review-english").textContent = reviewItem.english || "—";
  $("review-corsican").value = reviewItem.corsican;
  $("review-fix").disabled = true;
}

async function answer(verdict) {
  if (!reviewItem) return;
  const corsican = $("review-corsican").value;
  const response = await fetch("/api/review", { method: "POST", headers: { "X-Corsu-Key": key, "Content-Type": "application/json" },
    body: JSON.stringify({ language, french: reviewItem.french, english: reviewItem.english, verdict, corsican }) });
  if (!response.ok) {
    const result = await response.json().catch(() => ({}));
    $("review-error").textContent = result.error || response.status;
    $("review-error").hidden = false;
    return;
  }
  await loadReview();
  $("review-corsican").focus();
}

function renderExtras() {
  const info = state.update;
  $("update-banner").hidden = !(info && info.newer);
  if (info && info.newer) $("update-text").textContent = t("update_available", { version: info.version, current: state.version });
  $("update-install").disabled = state.job.running;
  $("switch-original").checked = Boolean(state.options && state.options.showOriginal);
}

function render() {
  document.documentElement.lang = language;
  document.title = "Corsu";
  for (const node of document.querySelectorAll("[data-t]")) node.textContent = t(node.dataset.t);
  $("language").value = language;
  if (!state) return;
  $("version").textContent = state.version;
  renderPrograms(); renderAdd(); renderHelp(); renderAbout(); renderActivity(); renderExtras();
}

async function refresh() {
  try {
    const next = await call("/api/state");
    if (state && state.job.running && !next.job.running) picks = null;
    state = next;
    if (!chosen) language = state.language;
    if (page === null) show(state.installed ? "programs" : "add");
    render();
  } catch (error) {
    if (closed) return;
    closed = true;
    document.querySelector("main").replaceChildren(make("p", { class: "closed", text: t("closed") }));
    $("activity").hidden = true;
  }
}

for (const button of document.querySelectorAll("[data-page]")) button.addEventListener("click", () => {
  show(button.dataset.page);
  if (button.dataset.page === "review") loadReview();
});
$("review-section").addEventListener("change", event => { reviewSection = event.target.value; loadReview(); });
$("review-corsican").addEventListener("input", () => { $("review-fix").disabled = !reviewItem || $("review-corsican").value === reviewItem.corsican; });
$("review-corsican").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); answer($("review-fix").disabled ? "ok" : "fix"); }
});
$("review-ok").addEventListener("click", () => answer("ok"));
$("review-fix").addEventListener("click", () => answer("fix"));
$("review-skip").addEventListener("click", () => answer("skip"));
$("review-send").addEventListener("click", async () => {
  const result = await call("/api/review/issue");
  if (!result || !result.count) { alert(t("review_none")); return; }
  if (result.url.includes("body=")) { window.open(result.url, "_blank", "noopener"); return; }
  try { await navigator.clipboard.writeText(result.text); } catch (error) {}
  alert(t("review_copied"));
  window.open(result.url, "_blank", "noopener");
});
$("switch-original").addEventListener("change", event => call("/api/options", { showOriginal: event.target.checked }).then(refresh));
$("update-install").addEventListener("click", () => call("/api/update", {}).then(refresh));
$("language").addEventListener("change", event => {
  language = event.target.value; chosen = true;
  try { localStorage.setItem("corsu-language", language); } catch (error) {}
  render();
});
$("switch-terminal").addEventListener("change", event => {
  call(event.target.checked ? "/api/switch" : "/api/pause", { components: ["terminal"], on: true }).then(refresh);
});
$("pause-hour").addEventListener("click", () => call("/api/pause", { hours: 1 }).then(refresh));
$("everything").addEventListener("click", () => call("/api/all", { on: state.everything_off }).then(refresh));
$("details-toggle").addEventListener("click", () => { showLog = !showLog; renderActivity(); });
$("review").addEventListener("click", async () => {
  if (!picks.size) { alert(t("pick_one")); return; }
  const result = await call("/api/plan", { components: [...picks] });
  if (!result) return;
  $("plan").textContent = result.plan;
  $("install").hidden = !result.ok;
  $("plan-dialog").showModal();
});
$("install").addEventListener("click", () => {
  $("plan-dialog").close();
  showLog = false;
  call("/api/install", { components: [...picks] }).then(refresh);
});
$("remove").addEventListener("click", () => $("remove-dialog").showModal());
$("remove-confirm").addEventListener("click", () => {
  $("remove-dialog").close();
  call("/api/uninstall", {}).then(refresh);
});
for (const button of document.querySelectorAll("[data-close]")) button.addEventListener("click", () => button.closest("dialog").close());

language = language || ((navigator.language || "fr").toLowerCase().startsWith("en") ? "en" : "fr");
render();
refresh();
setInterval(() => { if (!closed) refresh(); }, 1500);
</script>
</body>
</html>
