<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corsu</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f2a2e'/%3E%3Ctext x='16' y='22.5' font-family='Georgia,serif' font-size='19' font-weight='700' fill='white' text-anchor='middle'%3Eco%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand"><img src="corsu.svg" alt=""><b>Corsu</b><small id="version"></small></div>
    <nav aria-label="Corsu">
      <button type="button" data-page="programs" data-t="nav_programs"></button>
      <button type="button" data-page="add" data-t="nav_add"></button>
      <button type="button" data-page="review" data-t="nav_review"></button>
      <button type="button" data-page="help" data-t="nav_help"></button>
      <button type="button" data-page="about" data-t="nav_about"></button>
    </nav>
    <label class="language"><span data-t="language"></span>
      <select id="language"><option value="co">Corsu</option><option value="fr">Français</option><option value="en">English</option></select>
    </label>
  </aside>

  <main>
    <p class="banner problem" id="problem" hidden role="alert"></p>
    <div class="banner" id="update-banner" hidden aria-live="polite">
      <span id="update-text"></span>
      <button type="button" class="button default" id="update-install" data-t="update_install"></button>
      <button type="button" class="button default" id="update-banner-restart" data-t="update_restart"></button>
    </div>
    <section id="programs" data-page-panel>
      <h1 data-t="nav_programs"></h1>
      <p class="lead" id="programs-lead"></p>
      <ul class="group" id="switches"></ul>
      <div id="terminal-block" hidden>
        <h2 data-t="terminal"></h2>
        <ul class="group">
          <li>
            <span class="label"><label for="switch-terminal" data-t="terminal_label"></label><span class="detail" id="terminal-detail"></span></span>
            <span class="switch"><input type="checkbox" role="switch" id="switch-terminal"><i></i></span>
          </li>
        </ul>
        <div class="buttons"><button type="button" class="button" id="pause-hour" data-t="pause_hour"></button></div>
      </div>
      <h2 data-t="learn"></h2>
      <ul class="group">
        <li>
          <span class="label"><label for="switch-original" data-t="show_original"></label><span class="detail" data-t="show_original_detail"></span></span>
          <span class="switch"><input type="checkbox" role="switch" id="switch-original"><i></i></span>
        </li>
      </ul>
      <h2 data-t="everything"></h2>
      <p class="muted" id="everything-text"></p>
      <div class="buttons"><button type="button" class="button" id="everything"></button></div>
    </section>

    <section id="add" data-page-panel hidden>
      <h1 data-t="nav_add"></h1>
      <p class="lead" id="add-lead"></p>
      <ul class="group" id="choices"></ul>
      <div class="buttons"><button type="button" class="button default" id="review" data-t="install_ellipsis"></button></div>
      <p class="muted" style="margin-top:18px" data-t="add_missing"></p>
      <div class="buttons"><button type="button" class="button" id="rescan" data-t="rescan"></button></div>
    </section>

    <section id="review" data-page-panel hidden>
      <h1 data-t="nav_review"></h1>
      <p class="lead" data-t="review_lead"></p>
      <div class="toolbar">
        <select id="review-section" aria-label="Section"><option value="Discord">Discord</option><option value="Google">Google</option></select>
        <span class="muted" id="review-progress"></span>
      </div>
      <div class="review" id="review-card">
        <dl>
          <dt data-t="review_french"></dt><dd class="source" id="review-french"></dd>
          <dt data-t="review_english"></dt><dd class="muted" id="review-english"></dd>
          <dt><label for="review-corsican" data-t="review_corsican"></label></dt>
          <dd><textarea id="review-corsican" rows="2" spellcheck="false"></textarea><div class="error" id="review-error" hidden></div></dd>
        </dl>
        <div class="buttons">
          <button type="button" class="button default" id="review-ok" data-t="review_ok"></button>
          <button type="button" class="button" id="review-fix" data-t="review_fix"></button>
          <button type="button" class="button" id="review-skip" data-t="review_skip"></button>
        </div>
      </div>
      <p class="muted" id="review-done" hidden data-t="review_done"></p>
      <h2 data-t="review_share"></h2>
      <p class="muted" data-t="review_share_text"></p>
      <div class="buttons"><button type="button" class="button" id="review-send" data-t="review_send"></button></div>
    </section>

    <section id="help" data-page-panel hidden>
      <h1 data-t="nav_help"></h1>
      <p class="lead" data-t="help_lead"></p>
      <ul class="group" id="guides"></ul>
      <h2 data-t="practice"></h2>
      <p class="muted" data-t="practice_text"></p>
      <ul class="group" id="practice"></ul>
    </section>

    <section id="about" data-page-panel hidden>
      <h1 data-t="nav_about"></h1>
      <p class="lead" data-t="about_lead"></p>
      <dl class="facts" id="facts"></dl>
      <h2 id="update-heading" data-t="update_heading"></h2>
      <section aria-labelledby="update-heading">
        <dl class="facts" id="update-facts"></dl>
        <p class="update-status" id="update-status" role="status"></p>
        <p class="update-result" id="update-result" hidden></p>
        <div class="buttons">
          <button type="button" class="button default" id="update-now" data-t="update_install"></button>
          <button type="button" class="button default" id="update-restart" data-t="update_restart" hidden></button>
          <button type="button" class="button" id="update-check" data-t="update_check"></button>
        </div>
        <ul class="group" id="update-auto">
          <li>
            <span class="label"><label for="switch-auto-update" data-t="update_auto"></label><span class="detail" data-t="update_auto_detail"></span></span>
            <span class="switch"><input type="checkbox" role="switch" id="switch-auto-update"><i></i></span>
          </li>
        </ul>
      </section>
      <h2 data-t="logs"></h2>
      <p class="muted" data-t="logs_text"></p>
      <div class="buttons">
        <button type="button" class="button" id="open-logs" data-t="open_logs"></button>
        <a class="button" style="text-decoration:none;color:inherit" href="https://github.com/Platykalt/corsu/issues/new?template=bug.yml" target="_blank" rel="noopener noreferrer" data-t="report_bug"></a>
      </div>
      <h2 data-t="remove_heading"></h2>
      <p class="muted" data-t="remove_text"></p>
      <div class="buttons"><button type="button" class="button destructive" id="remove" data-t="remove_ellipsis"></button></div>
    </section>
  </main>

  <div class="activity" id="activity" hidden aria-live="polite">
    <div class="line">
      <span class="busy" id="busy"></span><span id="activity-text"></span>
      <button type="button" class="textbutton" id="details-toggle"></button>
    </div>
    <div class="meter" id="meter" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="meter-fill"></span></div>
    <div class="step" id="step"></div>
    <pre id="log" hidden></pre>
  </div>
</div>

<dialog id="plan-dialog" aria-labelledby="plan-title">
  <h3 id="plan-title" data-t="plan_title"></h3>
  <pre id="plan"></pre>
  <div class="buttons end">
    <button type="button" class="button" data-close data-t="cancel"></button>
    <button type="button" class="button default" id="install" data-t="install"></button>
  </div>
</dialog>

<dialog id="remove-dialog" aria-labelledby="remove-title">
  <h3 id="remove-title" data-t="remove_question"></h3>
  <p data-t="remove_text"></p>
  <div class="buttons end">
    <button type="button" class="button" data-close data-t="cancel"></button>
    <button type="button" class="button destructive" id="remove-confirm" data-t="remove"></button>
  </div>
</dialog>

<script src="texts.js"></script>
<script src="app.js"></script>
</body>
</html>
