// Corsu: completes Google's Corsican interface. Loaded only by Corsu's own copy of Firefox.
// The module sits in this copy's browser/omni.ja, so every page process can load it without any set-up.
try {
  const script = `
    const hosts = HOSTS;
    Services.obs.addObserver(doc => {
      try {
        const host = doc.location && doc.location.hostname;
        if (!host || !hosts.some(name => host === name || host.endsWith("." + name))) return;
        const start = () => ChromeUtils.importESModule("resource:///modules/corsu/CorsuChild.sys.mjs").translatePage(doc);
        if (doc.readyState === "loading") doc.addEventListener("DOMContentLoaded", start, { once: true });
        else start();
      } catch (error) {
        Components.utils.reportError("Corsu: " + error);
      }
    }, "document-element-inserted");
  `;
  Services.ppmm.loadProcessScript("data:application/javascript;charset=utf-8," + encodeURIComponent(script), true);
} catch (error) {
  Components.utils.reportError("Corsu: " + error);
}

// Firefox can update its New Tab page on its own, with its own English text. Corsu's launcher translates that
// text into the folder named by CORSU_NEWTAB, and the page reads it from there.
try {
  const folder = Services.env.get("CORSU_NEWTAB");
  if (folder) {
    const file = Components.classes["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
    file.initWithPath(folder);
    const root = Services.io.newFileURI(file).spec.replace(/\/?$/, "/") + "{locale}/";
    const { AboutNewTabResourceMapping } = ChromeUtils.importESModule("resource:///modules/AboutNewTabResourceMapping.sys.mjs");
    const { L10nFileSource } = Components.utils.getGlobalForObject(AboutNewTabResourceMapping);
    const build = AboutNewTabResourceMapping._buildNewtabFileSource;
    if (typeof build === "function") {
      AboutNewTabResourceMapping._buildNewtabFileSource = function (name, metasource) {
        const source = build.call(this, name, metasource);
        if (metasource !== "app") return source;
        return new L10nFileSource(name, metasource, source.locales || [Services.locale.appLocaleAsBCP47], root);
      };
    }
  }
} catch (error) {
  Components.utils.reportError("Corsu: " + error);
}
